name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test and Vet
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.3'

      - name: Show Go version
        run: go version

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .

      - name: Test
        run: go test ./... -race

  build:
    name: Build App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.3'

      - name: Build
        env:
          # mygo.json has updates, so the build signs the update archives
          # and needs the key; -skip-dmg leaves the disk image to Release.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -skip-dmg
